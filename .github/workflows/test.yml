name: Test

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check
        run: python -m py_compile app/*.py app/core/*.py app/routers/*.py app/services/*.py app/tasks/*.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Validate docker-compose config
        run: docker compose -f docker-compose.enterprise.yml config
