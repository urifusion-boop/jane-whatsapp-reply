user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/xml+rss application/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream webhook servers (least-connections with health checks)
    upstream jane_wa_webhooks {
        least_conn;

        server webhook-1:8081 max_fails=3 fail_timeout=30s;
        server webhook-2:8082 max_fails=3 fail_timeout=30s;
        server webhook-3:8083 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    # Upstream for other API endpoints
    upstream jane_wa_api {
        least_conn;

        server webhook-1:8081 max_fails=3 fail_timeout=30s;
        server webhook-2:8082 max_fails=3 fail_timeout=30s;
        server webhook-3:8083 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name jane-whatsapp.urisocial.com;

        # Health check endpoint (bypass rate limiting)
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name jane-whatsapp.urisocial.com;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Health check endpoint (bypass rate limiting)
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Meta WhatsApp Cloud API webhook (critical path — Meta expects a fast ack,
        # same discipline as Twilio's webhook in whatsapp-agent's nginx.conf)
        location /webhook {
            # Rate limiting: 10 requests/second per IP
            limit_req zone=webhook_limit burst=20 nodelay;
            limit_conn addr 10;

            proxy_pass http://jane_wa_webhooks;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (Meta expects a fast response)
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # No buffering for webhooks
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Internal API endpoints (e.g. /internal/conversations/{id}/resolve)
        location /internal/ {
            limit_req zone=api_limit burst=40 nodelay;
            limit_conn addr 20;

            proxy_pass http://jane_wa_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Root endpoint
        location / {
            proxy_pass http://jane_wa_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
